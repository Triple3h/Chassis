[package]
name = "launcher-shell"
version = "0.1.0"
description = "Launcher shell: system primitives only (window / hotkey / tray / notify / clipboard / open)"
authors = ["launcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "launcher_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
open = "5"

# `Window::start_resize_dragging` 的方向类型住在 tauri-runtime 里（tauri 没有 re-export）。
# 版本必须与 tauri 依赖的 tauri-runtime 对齐，否则类型是两个 crate（编译期就报错）。
tauri-runtime = "2"

# Accessibility API（选中文本原语 `selection.read`）的 CF 类型包装。
# 版本与 tauri 依赖树里的 core-foundation 对齐，避免同一 crate 编译两份。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
