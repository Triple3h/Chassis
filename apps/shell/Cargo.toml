[package]
name = "launcher-shell"
# 不要手改 version：**唯一维护点是根 `version.json`**，由 `scripts/version.mjs` 同步（`pnpm version:sync`）。
# 本字段与 `tauri.conf.json` 的 version 必须同值（`pnpm version:check` 拦漂移）——
# 壳运行时版本以 `tauri.conf.json` 为准（`build.rs` 读它注入 `SHELL_VERSION`；`pack-local-app.mjs` / `pack-app.mjs` 同源）。
version = "0.1.10"
description = "Launcher shell: system primitives only (window / hotkey / tray / notify / clipboard / open)"
authors = ["launcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "launcher_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
open = "5"

# `Window::start_resize_dragging` 的方向类型住在 tauri-runtime 里（tauri 没有 re-export）。
# 版本必须与 tauri 依赖的 tauri-runtime 对齐，否则类型是两个 crate（编译期就报错）。
tauri-runtime = "2"

# Accessibility API（选中文本原语 `selection.read`）的 CF 类型包装。
# 版本与 tauri 依赖树里的 core-foundation 对齐，避免同一 crate 编译两份。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Windows 平台原语：选中文本（UI Automation）/ 自身占用（PSAPI + ToolHelp 进程枚举）。
# 版本与 tauri 依赖树里的 windows 对齐（0.61），避免同一 crate 编译两份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
