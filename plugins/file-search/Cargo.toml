[package]
name = "launcher-plugin-file-search"
version = "0.1.0"
edition = "2021"
description = "文件搜索（file-search）逻辑层：mdfind 搜文件名 / open -R 在 Finder 中显示"
license = "MIT"
publish = false

[lib]
name = "launcher_plugin_file_search"
path = "src/lib.rs"

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "files"
path = "src/bin/files.rs"

[[bin]]
name = "reveal"
path = "src/bin/reveal.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde_json = "1"
# SDK 刻意零依赖（纯 std 线程）；需要异步的插件自建 runtime（见 src/lib.rs 的 `runtime()`）
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "sync"] }
# 目录变化监听（自建索引的增量：Windows 上即 ReadDirectoryChangesW）；
# 跨平台包体很小，只在 Windows 后端接（macOS 走 Spotlight，不需要自建索引）
notify = "8"

# Windows：Everything IPC（WM_COPYDATA 查询 + 隐藏消息窗口收回复，见 src/everything.rs）。
# 版本与 tauri 依赖树里的 windows 对齐（0.61），避免同一 crate 编译两份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  # `WNDCLASSW` / `RegisterClassW` 住在 gated 的 Gdi 特性后面（结构里有 HBRUSH 字段）
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
