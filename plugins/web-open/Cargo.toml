[package]
name = "launcher-plugin-web-open"
version = "0.1.0"
edition = "2021"
description = "网址直达（web-open）逻辑层：输入网址直接打开，或交给默认搜索引擎"
license = "MIT"
publish = false

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde_json = "1"
