[package]
name = "launcher-plugin-host-manager"
version = "0.1.0"
edition = "2021"
description = "系统 hosts 管理（host-manager）逻辑层：只换托管区、写入前备份、提权走系统对话框"
license = "MIT"
publish = false

[lib]
name = "launcher_plugin_host_manager"
path = "src/lib.rs"

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "hosts-read"
path = "src/bin/hosts_read.rs"

[[bin]]
name = "hosts-write"
path = "src/bin/hosts_write.rs"

[[bin]]
name = "hosts-permission"
path = "src/bin/hosts_permission.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 备份文件名里的时间戳（与 v1 `toISOString()` 的形状对齐）
chrono = "0.4"
# 提权路径的 UTF-16LE base64（Windows）
base64 = "0.22"
# `access(2)`：判断当前进程对目标文件有没有直接写权限（与 v1 的 accessSync 等价）
libc = "0.2"
# 提权对话框可能要等用户输密码（最长 120s），超时要能杀掉子进程
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "sync"] }
