[package]
name = "launcher-plugin-process-manager"
version = "0.1.0"
edition = "2021"
description = "进程与端口（process-manager）逻辑层：端口占用扫描 / 进程信息 / 安全终止"
license = "MIT"
publish = false

[lib]
name = "launcher_plugin_process_manager"
path = "src/lib.rs"

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "port-list"
path = "src/bin/port_list.rs"
[[bin]]
name = "proc-list"
path = "src/bin/proc_list.rs"
[[bin]]
name = "proc-detail"
path = "src/bin/proc_detail.rs"
[[bin]]
name = "proc-kill"
path = "src/bin/proc_kill.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 进程 CPU / 内存 / 用户 / 父进程 / 命令行：跨平台一次拿全（与内核状态条同款依赖，关默认特性）
# `user` = 进程归属用户（Users 表；不带它进程的用户名是空的）
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }

# Unix：kill(2) 发信号 + 轮询退场
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows：Start-Process -Verb RunAs 的 UTF-16LE base64 内层命令（绕开引号拼接）
[target.'cfg(windows)'.dependencies]
base64 = "0.22"
