[package]
name = "launcher-plugin-calc-pad"
version = "0.2.0"
edition = "2021"
description = "计算稿纸（calc-pad）逻辑层：输入算式时贡献一条「算式 = 结果」推荐项（回车打开稿纸）"
license = "MIT"
publish = false

[lib]
name = "launcher_plugin_calc_pad"
path = "src/lib.rs"

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "calc-eval"
path = "src/bin/calc_eval.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde_json = "1"
