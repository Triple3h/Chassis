[package]
name = "launcher-plugin-app-launcher"
version = "0.1.0"
edition = "2021"
description = "应用启动器（app-launcher）逻辑层：扫描 macOS .app、本地化名称、图标转 PNG、按名/别名打分"
license = "MIT"
publish = false

[lib]
name = "launcher_plugin_app_launcher"
path = "src/lib.rs"

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "search"
path = "src/bin/search.rs"

[[bin]]
name = "refresh"
path = "src/bin/refresh.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# plist 解析：v1 是自研（为了 esbuild 自包含），Rust 侧有现成 crate（binary + XML 都支持）
plist = "1"
# 图标缓存的文件名（与 v1 同款：sha1(图标源路径)）
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
# 并发扫描（v1 的 mapLimit(50)）
futures = "0.3"

# Windows 后端：shell 图标（SHGetFileInfoW + GDI 读位图）+ 注册表 App Paths。
# 版本与 tauri 依赖树里的 windows 对齐（0.61），避免同一 crate 编译两份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"
# HICON → PNG（macOS 走 sips，不需要它；只编 Windows 目标）
image = { version = "0.25", default-features = false, features = ["png"] }
