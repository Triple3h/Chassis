[package]
name = "launcher-plugin-totp"
version = "0.1.0"
edition = "2021"
description = "双重验证器（totp）逻辑层：扫最近截图 / 按路径读图片并转 base64（解码在 view 侧）"
license = "MIT"
publish = false

[lib]
name = "launcher_plugin_totp"
path = "src/lib.rs"

# bin 名 = commands[].name（plugin-spec §2.2 的 N1 铁律）
[[bin]]
name = "read-image"
path = "src/bin/read_image.rs"

[dependencies]
launcher-plugin-sdk = { path = "../../packages/plugin-sdk-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 图片内容以 base64 交回 View（解码在浏览器里由 zxing-wasm 做）
base64 = "0.22"
