# 静态与单元验证（不产包）：feature 分支 push / PR 触发。
#
# **main 推送不触发任何工作流**（含本文件）：main 的后续修改只由 PR 把关；
# 发布一律走 tag（App = `v*`，内核 = `kernel/*`，插件 = `plugins/*` ——
# 见 release.yml / kernel-release.yml / plugins-release.yml），避免「合入 main 即构建 / 部署」。
name: verify

on:
  push:
    branches-ignore: ['main']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck（TS / Vue）
        run: pnpm typecheck

      - name: test（TS）
        run: pnpm test

      - name: build（kernel / ui / plugins）
        run: pnpm build

      - name: spec-check（插件规范自检）
        run: pnpm spec-check

      - name: cargo test --workspace
        run: cargo test --workspace

  # Windows 侧同样要守：平台分支（UIA / icacls / App Paths / Everything IPC / 索引）
  # 只有真 Windows 能验证 —— 每次 PR 都过一遍编译 + 测试，避免"只在打 tag 时才发现编不过"。
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck（TS / Vue）
        run: pnpm typecheck

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo test（内核 / SDK / 各插件）
        run: cargo test --workspace
