# 应用（壳）自更新：把各平台的壳产物与 app-registry.json 发到固定 tag 的 Release。
#
# 两个平台各有产物（索引按 `platforms` 分发）：
#   - macOS：`.app` 的 zip（自动替换链路在用）
#   - Windows：绿色版目录的 zip（`Chassis.exe` + `resources/`）—— **自动替换尚未实现**
#     （运行中的 exe 写不了，安装路径见 docs/win-hot-update-research.md §4.3），
#     索引里带上它是给「手动换包 / 将来接上 helper」留一个稳定的下载入口
#
# 与另外三条通道完全独立（四个 tag 各自 releases/download/<tag>/... 直链，互不顶替）：
#   - App 换包（给人下载）：release.yml（tag v*）
#   - 插件：plugins-release.yml（tag plugins-latest）
#   - 内核：kernel-release.yml（tag kernel-latest）
#   - 应用自更新（客户端内置源）：本工作流（tag app-latest）
#
# 签名：CI 从 secrets 导入**本机同一张固定证书**（MACOS_SIGN_P12 / MACOS_SIGN_P12_PASSWORD，
# 由 `node scripts/export-signing-cert.mjs` 一次性导出）—— macOS 的 TCC 授权按签名身份记账，
# 身份跨版本稳定，客户端自更新才不会每次重弹授权。没配 secrets 时回落 ad-hoc：
# 包照样发得出去，但每次自更新后用户都要重新授权（日志里有 warning，别忽视）。
name: app-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 更新说明（展示在更新页）
        required: false
        default: ''
      min_shell_hot_version:
        description: 要求的最低壳自更新机制版本（低于它的客户端不提示更新；留空 = 用产物自报）
        required: false
        default: ''
  push:
    tags: ['app/*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 版本漂移在发版这一步就拦下：`version.json` 与三处位点不一致时，
      # 打出来的包会「客户端判不出新版本」或「版本号对不上」——比发出去再救便宜得多
      - name: 版本一致性（根 version.json 是唯一维护点）
        run: node scripts/version.mjs check

      - name: 导入固定签名证书（未配置 secrets 则回落 ad-hoc）
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::未配置 MACOS_SIGN_P12 —— 产物将是 ad-hoc 签名，客户端每次自更新后都要重新授权（辅助功能 / 屏幕录制）。导出方式见 scripts/export-signing-cert.mjs"
            exit 0
          fi
          KEYCHAIN=/tmp/chassis-signing.keychain-db
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out /tmp/chassis-signing.p12

          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import /tmp/chassis-signing.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # 取出证书本体：稍后要显式信任它（`security import` 只导身份，不会把它标成受信任）。
          #
          # 两处讲究：
          #  - 用 `security find-certificate` 而不是 `openssl pkcs12`：macOS `security export` 生成的
          #    p12 是 RC2-40-CBC 加密，runner 上的 Homebrew OpenSSL 3 默认拒绝
          #    （`unsupported algorithm RC2-40-CBC`，首次修复时踩过）；
          #  - 必须按名字取（`-c`）：p12 里带完整证书链，`-a -p` 会把 GlobalSign 中间证书排在前面，
          #    拿它去 add-trusted-cert 就信任错了对象。
          security find-certificate -c "Chassis Local Signing" -p "$KEYCHAIN" > /tmp/chassis-signing.pem

          # 自签名证书**必须显式信任**：否则 `find-identity -v` 报 "0 valid identities"，
          # 打包脚本（detectSigningIdentity）找不到身份 ⇒ 静默回落 ad-hoc（首次发版踩过：
          # 「3 identities imported」+「0 valid identities found」）。本地 make-signing-cert.mjs 也做这一步。
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain /tmp/chassis-signing.pem
          rm -f /tmp/chassis-signing.p12 /tmp/chassis-signing.pem

          # 不带 keychain 参数：列出搜索列表里的全部有效身份（这一行是签名的判据，应为 1 valid）
          security find-identity -v -p codesigning

      - run: pnpm install --frozen-lockfile
      # 与 release.yml 同一条组装路径（build-all → 资源就位 → cargo build 壳 → 组装 + 签名）；
      # 差别只在：这里还会走 pack-app（压 zip + 写分片）并把产物发到 app-latest。
      - run: node scripts/build-all.mjs
      - run: node scripts/pack-local-app.mjs --skip-build
      - run: node scripts/pack-app.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: app/release/*
          if-no-files-found: error

  # Windows 与 macOS 并行：同一个 version.json、同一条 build-all；差别只在打包脚本
  # （pack-win 一条命令走完 build-all → 资源就位 → cargo build 壳 → 绿色版 zip）
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 版本一致性（根 version.json 是唯一维护点）
        run: node scripts/version.mjs check

      - run: pnpm install --frozen-lockfile
      - run: node scripts/pack-win.mjs
      # 只搬运 pack-win 的 zip 并写分片（压缩逻辑不重复第二份）
      - run: node scripts/pack-app.mjs --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app/release/*
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: app/release
          merge-multiple: true

      - name: 汇总生成 app-registry.json
        env:
          NOTES: ${{ inputs.notes }}
          MIN_HOT: ${{ inputs.min_shell_hot_version }}
        run: |
          args=()
          [ -n "$NOTES" ] && args+=(--notes "$NOTES")
          [ -n "$MIN_HOT" ] && args+=(--min-shell-hot-version "$MIN_HOT")
          node scripts/gen-app-registry.mjs "${args[@]}"
          rm -f app/release/app-shard-*.json
          ls -la app/release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 应用更新源
          files: app/release/*
          allowUpdates: true
          overwrite_files: true
          # 不抢仓库的 Latest 徽标（保持 App 的 v* Release）
          make_latest: false
          body: |
            应用（壳）自更新通道（客户端内置的固定源，一般不需要手动下载）。

            - `app-registry.json`：索引（schema 1，含各平台产物的 sha256 与最低壳自更新机制版本）
            - `Chassis-<版本>-macos-<架构>.zip`：完整 `.app`（解压结构 = `Chassis.app/Contents/…`）
            - `Chassis-<版本>-win-<架构>.zip`：Windows 绿色版（解压结构 = `Chassis.exe` + `resources/`）

            安装由 `internal-store` 的「更新应用」发起：下载 → sha256 校验 → 解压 →
            `pluginAction('applyShellUpdate')` → 壳校验候选包（`--hot-probe`）→ 备份 → 独立 helper 替换 →
            重新启动；新版本连续两次启动未就绪会自动回滚。**macOS 与 Windows 同一套流程**，
            差别只在安装形态（`.app` / 绿色版目录）与 helper（`swap.sh` / `swap.ps1`，见 docs/shell-hot-update.md）。

      # 同 release 里只保留本次索引指向的 zip（理由同 plugins-release.yml 的同名步骤）：
      # 每次自更新都会打出新文件名的 zip，不清理就会在 app-latest 里无限积累
      - name: 清理旧版本资产（只保留索引指向的最新包）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-release-assets.mjs --tag app-latest --registry app/release/app-registry.json
