# 发布：把两个平台的产物发到 GitHub Release（docs/m5-rust-and-windows.md §B3.7）。
#
# 为什么必须走 Release 而不是 artifact：公开仓库的 artifact 下载要登录 GitHub，
# Release 附件任何人都能直接下 —— 这才是"发给同事"的通道。
#
# 零 secrets：CI 上签不了证书（固定签名证书只在本机钥匙串里），
# macOS 产物回落 ad-hoc 签名 ⇒ 不引入任何密钥。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（形如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-all.mjs
      # 壳单独编（pack-local-app.mjs 负责）；产物 → dist-app/Chassis.app
      - run: node scripts/pack-local-app.mjs --skip-build
      - name: 压成 zip（.app 是目录，Release 附件只收文件）
        run: ditto -c -k --sequesterRsrc --keepParent dist-app/Chassis.app dist-app/Chassis-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chassis-macos-arm64
          path: dist-app/Chassis-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      # 不带 --skip-build：pack-win 内部按序做 build-all（内核/UI/插件）→ 资源就位 →
      # cargo build 壳 → 组装 + 压 zip。之前拆成两步且给 --skip-build，壳从未被编过，
      # pack-win 以「找不到壳产物」失败（首次 CI 抓到）。
      - run: node scripts/pack-win.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Chassis-win-x64
          path: dist-app/*.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 列出待发布产物
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            两个平台都在各自平台上**原生构建**（不做交叉编译）：
            - macOS：`Chassis-macos-arm64.zip`（未公证，下载后「右键 → 打开」或 `xattr -dr com.apple.quarantine Chassis.app`）
            - Windows：`Chassis-<version>-win-x64.zip`（绿色版，解压即用；未签名 ⇒ SmartScreen 提示「更多信息 → 仍要运行」）

            发布产物不含 Node（壳 / 内核 / 逻辑层插件全 Rust）。
